{% extends 'base.html' %}
{% block content %}
<style>
    .auth-container {
        display: flex; justify-content: center; align-items: center; min-height: 80vh;
        padding: 20px;
    }
    .auth-box {
        background: #fff; border-radius: 24px; width: 100%; max-width: 450px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08); padding: 50px 40px; position: relative; overflow: hidden;
    }
    .auth-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary)); }
    
    .auth-header { text-align: center; margin-bottom: 40px; }
    .auth-icon { width: 70px; height: 70px; background: #f1f5f9; border-radius: 20px; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; font-size: 28px; color: var(--brand-primary); }
    .auth-title { font-size: 28px; font-weight: 800; color: #0f172a; margin: 0 0 10px; letter-spacing: -0.5px; }
    .auth-sub { color: #64748b; font-size: 15px; }

    .input-grp { margin-bottom: 25px; position: relative; }
    .input-grp input {
        width: 100%; padding: 16px 20px 16px 50px; border: 2px solid #e2e8f0; border-radius: 14px;
        font-family: inherit; font-size: 15px; color: #1e293b; font-weight: 600; box-sizing: border-box; transition: 0.3s;
    }
    .input-grp input:focus { outline: none; border-color: var(--brand-secondary); box-shadow: 0 0 0 4px rgba(8,217,214,0.15); }
    .input-grp i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 18px; transition: 0.3s; }
    .input-grp input:focus + i { color: var(--brand-secondary); }

    .btn-auth {
        width: 100%; padding: 16px; border: none; border-radius: 14px;
        background: linear-gradient(135deg, var(--brand-primary), #FF5E83); color: white;
        font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;
        box-shadow: 0 10px 25px rgba(255, 46, 99, 0.3); transition: 0.3s; letter-spacing: 0.5px;
    }
    .btn-auth:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(255, 46, 99, 0.4); }

    .auth-footer { text-align: center; margin-top: 30px; }
    .auth-link { color: #475569; text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.3s; }
    .auth-link strong { color: var(--brand-primary); font-weight: 700; }
    .auth-link:hover { color: #0f172a; }

    /* Custom Alert */
    .alert-box {
        background: #fee2e2; border: 1px solid #f87171; color: #b91c1c; padding: 14px 20px;
        border-radius: 12px; margin-top: 25px; font-size: 14px; font-weight: 600;
        display: flex; align-items: center; gap: 10px;
    }
</style>

<div class="auth-container">
    <div class="auth-box">
        <div class="auth-header">
            <div class="auth-icon"><i class="fa-solid fa-fingerprint"></i></div>
            <h2 class="auth-title">Welcome Back</h2>
            <div class="auth-sub">Enter your credentials to access the terminal</div>
        </div>

        <form method="POST">
            <div class="input-grp">
                <input type="text" name="username" placeholder="Employee / Node ID" required autocomplete="off">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="input-grp">
                <input type="password" name="password" placeholder="Passkey" required>
                <i class="fa-solid fa-lock"></i>
            </div>
            
            <button type="submit" class="btn-auth">Secure Login</button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('register') }}" class="auth-link">Don't have an ID? <strong>Request Access</strong></a>
        </div>

        {% if error %}
        <div class="alert-box">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ error }}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
