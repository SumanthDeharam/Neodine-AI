{% extends 'base.html' %}
{% block content %}
<style>
    .auth-container {
        display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px;
    }
    .auth-box {
        background: #fff; border-radius: 24px; width: 100%; max-width: 480px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08); padding: 50px 40px; position: relative; overflow: hidden;
    }
    .auth-box::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, var(--brand-secondary), var(--brand-primary)); }
    
    .auth-header { text-align: center; margin-bottom: 40px; }
    .auth-icon { width: 70px; height: 70px; background: #f1f5f9; border-radius: 20px; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; font-size: 28px; color: var(--brand-secondary); }
    .auth-title { font-size: 28px; font-weight: 800; color: #0f172a; margin: 0 0 10px; letter-spacing: -0.5px; }
    .auth-sub { color: #64748b; font-size: 15px; }

    .input-grp { margin-bottom: 25px; position: relative; }
    .input-grp input {
        width: 100%; padding: 16px 20px 16px 50px; border: 2px solid #e2e8f0; border-radius: 14px;
        font-family: inherit; font-size: 15px; color: #1e293b; font-weight: 600; box-sizing: border-box; transition: 0.3s;
    }
    .input-grp input:focus { outline: none; border-color: var(--brand-secondary); box-shadow: 0 0 0 4px rgba(8,217,214,0.15); }
    .input-grp i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 18px; transition: 0.3s; }
    .input-grp input:focus + i { color: var(--brand-secondary); }

    .btn-auth {
        width: 100%; padding: 16px; border: none; border-radius: 14px;
        background: #1e293b; color: white;
        font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;
        box-shadow: 0 10px 25px rgba(30, 41, 59, 0.3); transition: 0.3s; letter-spacing: 0.5px;
    }
    .btn-auth:hover { background: #0f172a; transform: translateY(-3px); box-shadow: 0 15px 35px rgba(15, 23, 42, 0.4); }

    .auth-footer { text-align: center; margin-top: 30px; }
    .auth-link { color: #475569; text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.3s; }
    .auth-link strong { color: var(--brand-secondary); font-weight: 700; }
    .auth-link:hover { color: #0f172a; }

    .alert-box {
        padding: 14px 20px; border-radius: 12px; margin-top: 25px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px;
    }
    .alert-error { background: #fee2e2; border: 1px solid #f87171; color: #b91c1c; }
    .alert-success { background: #dcfce7; border: 1px solid #4ade80; color: #166534; }
</style>

<div class="auth-container">
    <div class="auth-box">
        <div class="auth-header">
            <div class="auth-icon"><i class="fa-solid fa-server"></i></div>
            <h2 class="auth-title">Node Provisioning</h2>
            <div class="auth-sub">Request clearance for a new terminal</div>
        </div>

        <form method="POST">
            <div class="input-grp">
                <input type="text" name="username" placeholder="Enterprise ID / Alias" required autocomplete="off">
                <i class="fa-solid fa-building"></i>
            </div>
            <div class="input-grp">
                <input type="password" name="password" placeholder="Define Passkey" required>
                <i class="fa-solid fa-key"></i>
            </div>
            
            <button type="submit" class="btn-auth">Submit Application</button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('login') }}" class="auth-link">Already a registered node? <strong>Authenticate</strong></a>
        </div>

        {% if error %}
        <div class="alert-box alert-error">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
        </div>
        {% endif %}
        
        {% if success %}
        <div class="alert-box alert-success" style="flex-direction: column; text-align:center;">
            <div><i class="fa-solid fa-check-circle" style="font-size:24px; margin-bottom:5px;"></i></div>
            {{ success }}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
