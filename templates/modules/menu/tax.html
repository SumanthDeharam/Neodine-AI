{% extends 'base.html' %}
{% block content %}
{% include 'modules/_mod_styles.html' %}
<div class="mod-page">
  <div class="mod-topbar">
    <div class="mod-breadcrumb">
      <span>Neo Dine</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <span>Menu &amp; Inventory</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <strong>Tax Configuration</strong>
    </div>
    <a href="/" class="back-pos-btn"><i class="fa-solid fa-arrow-left"></i> Back to POS</a>
  </div>
  <div class="mod-stats">
    <div class="stat-card"><div class="stat-icon" style="background:rgba(255,46,99,0.1);color:#FF2E63;"><i class="fa-solid fa-percent"></i></div><div class="stat-body"><span class="stat-val">5%</span><span class="stat-lbl">GST Rate</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(16,185,129,0.1);color:#10b981;"><i class="fa-solid fa-circle-check"></i></div><div class="stat-body"><span class="stat-val">Active</span><span class="stat-lbl">GST Status</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(99,102,241,0.1);color:#6366f1;"><i class="fa-solid fa-layer-group"></i></div><div class="stat-body"><span class="stat-val">1</span><span class="stat-lbl">Tax Slabs</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(245,158,11,0.1);color:#f59e0b;"><i class="fa-solid fa-indian-rupee-sign"></i></div><div class="stat-body"><span class="stat-val">₹0</span><span class="stat-lbl">GST Collected Today</span></div></div>
  </div>
  <div class="mod-body">
    <div class="data-card">
      <div class="data-card-hdr"><h3><i class="fa-solid fa-percent"></i> Tax Settings</h3></div>
      <div class="mod-form-grid">
        <div class="mod-form-group"><label>GST Percentage</label><input type="number" value="5" min="0" max="28" step="0.5"></div>
        <div class="mod-form-group"><label>GST Number (GSTIN)</label><input type="text" placeholder="e.g. 29ABCDE1234F1Z5"></div>
        <div class="mod-form-group"><label>Tax Inclusive Pricing</label><select><option>No (Tax added on top)</option><option>Yes (Tax included in price)</option></select></div>
        <div class="mod-form-group"><label>Service Charge</label><input type="number" value="0" min="0" max="20" step="0.5" placeholder="0%"></div>
        <div class="mod-form-group"><label>CGST Split</label><input type="number" value="2.5" readonly style="background:#f0fdf4;"></div>
        <div class="mod-form-group"><label>SGST Split</label><input type="number" value="2.5" readonly style="background:#f0fdf4;"></div>
      </div>
      <button class="mod-save-btn"><i class="fa-solid fa-floppy-disk"></i> Save Tax Settings</button>
    </div>
  </div>
</div>
{% endblock %}
