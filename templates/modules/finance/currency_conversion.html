{% extends 'base.html' %}
{% block content %}
{% include 'modules/_mod_styles.html' %}
<div class="mod-page">
  <div class="mod-topbar">
    <div class="mod-breadcrumb">
      <span>Neo Dine</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <span>Finance</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <strong>Currency Conversion</strong>
    </div>
    <a href="/" class="back-pos-btn"><i class="fa-solid fa-arrow-left"></i> Back to POS</a>
  </div>
  <div class="mod-stats">
    <div class="stat-card"><div class="stat-icon" style="background:rgba(99,102,241,0.1);color:#6366f1;"><i class="fa-solid fa-indian-rupee-sign"></i></div><div class="stat-body"><span class="stat-val">INR</span><span class="stat-lbl">Base Currency</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(16,185,129,0.1);color:#10b981;"><i class="fa-solid fa-dollar-sign"></i></div><div class="stat-body"><span class="stat-val">1 USD</span><span class="stat-lbl">≈ ₹83.50</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(245,158,11,0.1);color:#f59e0b;"><i class="fa-solid fa-euro-sign"></i></div><div class="stat-body"><span class="stat-val">1 EUR</span><span class="stat-lbl">≈ ₹90.20</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(255,46,99,0.1);color:#FF2E63;"><i class="fa-solid fa-sterling-sign"></i></div><div class="stat-body"><span class="stat-val">1 GBP</span><span class="stat-lbl">≈ ₹106.40</span></div></div>
  </div>
  <div class="mod-body">
    <div class="data-card">
      <div class="data-card-hdr"><h3><i class="fa-solid fa-money-check-dollar"></i> Currency Converter</h3></div>
      <div class="mod-form-grid" style="max-width:500px;">
        <div class="mod-form-group"><label>Amount</label><input type="number" placeholder="Enter amount" value="1000"></div>
        <div class="mod-form-group"><label>From Currency</label>
          <select><option>INR - Indian Rupee</option><option>USD - US Dollar</option><option>EUR - Euro</option><option>GBP - British Pound</option></select>
        </div>
        <div class="mod-form-group"><label>To Currency</label>
          <select><option>USD - US Dollar</option><option>INR - Indian Rupee</option><option>EUR - Euro</option><option>GBP - British Pound</option></select>
        </div>
        <div class="mod-form-group"><label>Converted Amount</label><input type="text" placeholder="Result appears here" readonly style="background:#f0fdf4;color:#166534;font-weight:800;"></div>
      </div>
      <button class="mod-save-btn"><i class="fa-solid fa-rotate"></i> Convert</button>
    </div>
  </div>
</div>
{% endblock %}
