{% extends 'base.html' %}
{% block content %}
{% include 'modules/_mod_styles.html' %}
<div class="mod-page">
  <div class="mod-topbar">
    <div class="mod-breadcrumb">
      <span>Neo Dine</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <span>Reports</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <strong>Tip Summary</strong>
    </div>
    <a href="/" class="back-pos-btn"><i class="fa-solid fa-arrow-left"></i> Back to POS</a>
  </div>
  <div class="mod-stats">
    <div class="stat-card"><div class="stat-icon" style="background:rgba(255,46,99,0.1);color:#FF2E63;"><i class="fa-solid fa-hand-holding-dollar"></i></div><div class="stat-body"><span class="stat-val">₹0</span><span class="stat-lbl">Today Tips</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(16,185,129,0.1);color:#10b981;"><i class="fa-solid fa-calendar-week"></i></div><div class="stat-body"><span class="stat-val">₹0</span><span class="stat-lbl">This Week</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(99,102,241,0.1);color:#6366f1;"><i class="fa-solid fa-calendar"></i></div><div class="stat-body"><span class="stat-val">₹0</span><span class="stat-lbl">This Month</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(245,158,11,0.1);color:#f59e0b;"><i class="fa-solid fa-calculator"></i></div><div class="stat-body"><span class="stat-val">₹0</span><span class="stat-lbl">Avg. Per Order</span></div></div>
  </div>
  <div class="mod-body">
    <div class="data-card">
      <div class="data-card-hdr"><h3><i class="fa-solid fa-hand-holding-dollar"></i> Tip Records</h3></div>
      <div class="empty-state"><i class="fa-solid fa-hand-holding-dollar"></i><p>No tips recorded yet. Tips will appear here when customers leave gratuity.</p></div>
    </div>
  </div>
</div>
{% endblock %}
