{% extends 'base.html' %}
{% block content %}
{% include 'modules/_mod_styles.html' %}
<div class="mod-page">
  <div class="mod-topbar">
    <div class="mod-breadcrumb">
      <span>Neo Dine</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <span>Settings</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <strong>Billing User Profile</strong>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="mod-btn mod-btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Profile</button>
      <a href="/" class="back-pos-btn"><i class="fa-solid fa-arrow-left"></i> Back to POS</a>
    </div>
  </div>
  <div class="mod-body" style="padding-top:20px;">
    <div class="data-card">
      <div class="data-card-hdr"><h3><i class="fa-solid fa-id-badge"></i> User Profile Details</h3></div>
      <div class="mod-form-grid">
        <div class="mod-form-group"><label>Full Name</label><input type="text" value="{{ current_user.username }}" placeholder="Your full name"></div>
        <div class="mod-form-group"><label>Username</label><input type="text" value="{{ current_user.username }}" readonly style="background:#f8fafc;color:#94a3b8;"></div>
        <div class="mod-form-group"><label>Role</label><input type="text" value="{{ current_user.status }}" readonly style="background:#f8fafc;color:#94a3b8;"></div>
        <div class="mod-form-group"><label>Contact Number</label><input type="tel" placeholder="10-digit mobile number"></div>
        <div class="mod-form-group"><label>Email Address</label><input type="email" placeholder="your@email.com"></div>
        <div class="mod-form-group"><label>Restaurant Name</label><input type="text" value="Neo Dine AI" placeholder="Restaurant name"></div>
        <div class="mod-form-group"><label>New Password</label><input type="password" placeholder="Leave blank to keep current"></div>
        <div class="mod-form-group"><label>Confirm Password</label><input type="password" placeholder="Re-enter new password"></div>
      </div>
      <button class="mod-save-btn"><i class="fa-solid fa-floppy-disk"></i> Update Profile</button>
    </div>
  </div>
</div>
{% endblock %}
