{% extends 'base.html' %}
{% block content %}
{% include 'modules/_mod_styles.html' %}
<style>
  .table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;padding:20px;}
  .table-tile{border-radius:14px;padding:24px 16px;text-align:center;cursor:pointer;border:2px solid transparent;transition:0.2s;position:relative;}
  .table-tile.empty{background:#f0fdf4;border-color:#bbf7d0;}
  .table-tile.occupied{background:#fff1f2;border-color:#fecdd3;}
  .table-tile.reserved{background:#fefce8;border-color:#fde68a;}
  .table-num{font-size:26px;font-weight:800;color:#1e293b;}
  .table-lbl{font-size:11px;font-weight:700;text-transform:uppercase;margin-top:6px;letter-spacing:0.5px;}
  .table-tile.empty .table-lbl{color:#166534;}
  .table-tile.occupied .table-lbl{color:#9f1239;}
  .table-tile.reserved .table-lbl{color:#92400e;}
  .table-tile:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.08);}
</style>
<div class="mod-page">
  <div class="mod-topbar">
    <div class="mod-breadcrumb">
      <span>Neo Dine</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <span>Operations</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <strong>Table Management</strong>
    </div>
    <a href="/" class="back-pos-btn"><i class="fa-solid fa-arrow-left"></i> Back to POS</a>
  </div>
  <div class="mod-stats">
    <div class="stat-card"><div class="stat-icon" style="background:rgba(16,185,129,0.1);color:#10b981;"><i class="fa-solid fa-chair"></i></div><div class="stat-body"><span class="stat-val">12</span><span class="stat-lbl">Total Tables</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(255,46,99,0.1);color:#FF2E63;"><i class="fa-solid fa-users"></i></div><div class="stat-body"><span class="stat-val">0</span><span class="stat-lbl">Occupied</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(245,158,11,0.1);color:#f59e0b;"><i class="fa-solid fa-calendar-check"></i></div><div class="stat-body"><span class="stat-val">0</span><span class="stat-lbl">Reserved</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(99,102,241,0.1);color:#6366f1;"><i class="fa-solid fa-percent"></i></div><div class="stat-body"><span class="stat-val">0%</span><span class="stat-lbl">Occupancy</span></div></div>
  </div>
  <div class="mod-body">
    <div class="data-card">
      <div class="data-card-hdr"><h3><i class="fa-solid fa-chair"></i> Table Layout</h3></div>
      <div class="table-grid">
        {% for i in range(1, 13) %}
        <div class="table-tile empty">
          <div class="table-num">T{{ i }}</div>
          <div class="table-lbl">Available</div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
