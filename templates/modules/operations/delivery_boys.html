{% extends 'base.html' %}
{% block content %}
{% include 'modules/_mod_styles.html' %}
<style>
  .rider-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;display:flex;align-items:center;gap:16px;transition:0.2s;}
  .rider-card:hover{border-color:#FF2E63;box-shadow:0 4px 16px rgba(255,46,99,0.08);}
  .rider-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#FF2E63,#FF5E83);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:800;flex-shrink:0;}
  .rider-info{flex:1;}
  .rider-name{font-weight:800;color:#1e293b;font-size:15px;}
  .rider-meta{font-size:12px;color:#94a3b8;margin-top:2px;}
  .rider-stats{display:flex;gap:16px;align-items:center;}
  .rider-stat{text-align:center;}
  .rider-stat .rv{font-weight:800;color:#1e293b;font-size:16px;}
  .rider-stat .rl{font-size:11px;color:#94a3b8;text-transform:uppercase;}
  .riders-grid{display:flex;flex-direction:column;gap:12px;padding:20px;}
</style>
<div class="mod-page">
  <div class="mod-topbar">
    <div class="mod-breadcrumb">
      <span>Neo Dine</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <span>Operations</span><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
      <strong>Delivery Boys</strong>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="mod-btn mod-btn-primary" onclick="alert('Add delivery boy feature coming soon!')"><i class="fa-solid fa-plus"></i> Add Rider</button>
      <a href="/" class="back-pos-btn"><i class="fa-solid fa-arrow-left"></i> Back to POS</a>
    </div>
  </div>
  <div class="mod-stats">
    <div class="stat-card"><div class="stat-icon" style="background:rgba(255,46,99,0.1);color:#FF2E63;"><i class="fa-solid fa-motorcycle"></i></div><div class="stat-body"><span class="stat-val">0</span><span class="stat-lbl">Total Riders</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(16,185,129,0.1);color:#10b981;"><i class="fa-solid fa-circle-dot"></i></div><div class="stat-body"><span class="stat-val">0</span><span class="stat-lbl">Online Now</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(245,158,11,0.1);color:#f59e0b;"><i class="fa-solid fa-truck-fast"></i></div><div class="stat-body"><span class="stat-val">0</span><span class="stat-lbl">On Delivery</span></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:rgba(99,102,241,0.1);color:#6366f1;"><i class="fa-solid fa-star"></i></div><div class="stat-body"><span class="stat-val">—</span><span class="stat-lbl">Avg. Rating</span></div></div>
  </div>
  <div class="mod-body">
    <div class="data-card">
      <div class="data-card-hdr"><h3><i class="fa-solid fa-motorcycle"></i> Delivery Team</h3></div>
      <div class="riders-grid">
        <div class="empty-state"><i class="fa-solid fa-motorcycle"></i><p>No delivery boys added yet. Click "Add Rider" to register your delivery team.</p></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
